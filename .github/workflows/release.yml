# A release: run this on master with publish (just release-publish), for the
# version in crates/herdr-core/Cargo.toml. It builds before it tags, because a
# tagged commit can't hold the hashes of binaries built from it.
# Five builds: Linux x86_64/aarch64, macOS x86_64/aarch64, and Windows x86_64.
# Linux uses static musl for compatibility with older distros.
# Then: versioned files up under core/<version>/ (not announced yet); commit P
# = this commit + nix/pins.json with their hashes, tagged v<version>; the flake
# at P built on each Nix system and pushed to Cachix; core/latest.json last, so
# nobody sees a version whose files aren't up yet; master moves to P.
# A fork (no R2, Apple, Azure or Cachix secrets) runs all but those steps.
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in Cargo.toml (off builds only)
        type: boolean
        default: false
      sha:
        description: The commit whose CI passed; publishing needs master to still be it
        type: string
        default: ""

permissions:
  contents: read

# Never cancel: a cancelled release run is a half release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  RELEASE: ${{ inputs.publish }}

jobs:
  # Publishing: only Can on herdrdev, only from the default branch, only a
  # version that has no tag yet.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          ACTOR: ${{ github.triggering_actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WANT_SHA: ${{ inputs.sha }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/herdr-core/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" = true ]; then
            if [ "$GITHUB_REPOSITORY" = herdrdev/herdr-core ] && [ "$ACTOR" != ogulcancelik ]; then echo "only Can publishes"; exit 1; fi
            [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || { echo "publish from $DEFAULT_BRANCH, not $GITHUB_REF"; exit 1; }
            [ "$GITHUB_SHA" = "$WANT_SHA" ] || { echo "$DEFAULT_BRANCH is $GITHUB_SHA, not the checked ${WANT_SHA:-(no sha input)}"; exit 1; }
            tags=$(git ls-remote --tags origin "refs/tags/v$version")
            [ -z "$tags" ] || { echo "v$version already exists"; exit 1; }
          fi
          echo "publish=$RELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { name: linux-aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, target: aarch64-apple-darwin, runner: macos-15 }
          # Cross-build on Apple Silicon; verify the Intel binary under Rosetta.
          - { name: macos-x86_64, target: x86_64-apple-darwin, runner: macos-15 }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    # Only publishing runs can use the release environment's Apple certificate.
    environment: ${{ inputs.publish && 'release' || 'build' }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-release
          cache-workspace-crates: true
          cache-bin: false
          # Tags can't share their caches; only manual builds on master save one.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p herdr-core
      - name: Assemble macOS bundle
        if: runner.os == 'macOS'
        run: sh scripts/mac-bundle target/${{ matrix.target }}/release/herdr-core 'target/${{ matrix.target }}/release/Herdr Core.app'
      - name: Sign macOS bundle and standalone executable
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ inputs.publish && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.publish && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        run: |
          # A fork has no certificate: ad-hoc signed.
          if [ "$RELEASE" = true ] && [ "$GITHUB_REPOSITORY" = herdrdev/herdr-core ]; then
            : "${APPLE_CERTIFICATE_P12:?missing release certificate}"
            : "${APPLE_CERTIFICATE_PASSWORD:?missing release certificate password}"
          fi
          scripts/mac-sign 'target/${{ matrix.target }}/release/Herdr Core.app'
          scripts/mac-sign 'target/${{ matrix.target }}/release/herdr-core'
      - name: Notarize macOS bundle and standalone executable
        if: runner.os == 'macOS' && inputs.publish && github.repository == 'herdrdev/herdr-core'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/Herdr Core.app'
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/herdr-core'
      - name: Pack
        if: runner.os != 'Windows'
        run: |
          bin=target/${{ matrix.target }}/release/herdr-core
          "$bin" --version # it runs on its own platform
          if [ "${{ runner.os }}" = Linux ]; then file "$bin" | grep -q 'static' || { file "$bin"; echo "not static"; exit 1; }; fi
          mkdir -p dist
          if [ "${{ runner.os }}" = macOS ]; then bin="$(dirname "$bin")/Herdr Core.app"; fi
          sh scripts/package "$bin" dist/herdr-core-${{ matrix.name }}.tar.gz
      # Windows: a zip of the exe, Microsoft's ConPTY (Windows' own swallows
      # answers to programs) and its notices. Zipped by Windows' tar, which
      # is also what unpacks it.
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/herdr-core.exe"
          & $bin --version
          if ($LASTEXITCODE) { throw "it does not run" }
          # A clean Windows has no Visual C++ runtime.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($bin)).ToLower()
          foreach ($dll in "vcruntime140", "msvcp140", "api-ms-win-crt-") { if ($text.Contains($dll)) { throw "herdr-core.exe imports $dll" } }
          New-Item -ItemType Directory -Force stage/THIRD-PARTY-NOTICES, dist | Out-Null
          Copy-Item $bin stage/
          Copy-Item LICENSE stage/
          Copy-Item crates/herdr-core/THIRD-PARTY-NOTICES stage/THIRD-PARTY-NOTICES/herdr-core.txt
          scripts/fetch-conpty.ps1 -Dest stage
          Copy-Item distribution/windows/* stage/THIRD-PARTY-NOTICES/
          tar -a -cf dist/herdr-core-${{ matrix.name }}.zip -C stage herdr-core.exe conpty LICENSE THIRD-PARTY-NOTICES
          if ($LASTEXITCODE) { throw "zip failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-core-${{ matrix.name }}
          path: dist/herdr-core-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

  # Sign Windows builds for maintainer runs. ConPTY is already signed.
  # Azure trusts only the signing environment (v* tags and master).
  # Azure IDs are environment variables; the job condition needs repository-level
  # AZURE_SIGNING_PROFILE. Unset profile means unsigned releases.
  sign-windows:
    needs: build
    if: github.triggering_actor == 'ogulcancelik' && vars.AZURE_SIGNING_PROFILE != ''
    environment: signing
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-core-windows-x86_64
          path: dist
      - run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          tar -xf dist/herdr-core-windows-x86_64.zip -C stage
          if ($LASTEXITCODE) { throw "unzip failed" }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: herdrsigning
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\stage\herdr-core.exe
          description: Herdr
          description-url: https://herdr.dev
      - name: Check the signature
        run: |
          $sig = Get-AuthenticodeSignature stage\herdr-core.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { exit 1 }
      - run: |
          Remove-Item dist/herdr-core-windows-x86_64.zip
          tar -a -cf dist/herdr-core-windows-x86_64.zip -C stage herdr-core.exe conpty LICENSE THIRD-PARTY-NOTICES
          if ($LASTEXITCODE) { throw "zip failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-core-windows-x86_64
          path: dist/herdr-core-windows-x86_64.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The versioned files go up first, under core/<version>/ where nothing
  # announces them yet. Nothing is tagged if this fails.
  stage:
    needs: [prepare, build, sign-windows]
    # Only Can: anyone with write access can re-run a run's failed jobs.
    # sign-windows may be skipped, not failed.
    if: >-
      !cancelled() && needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
      && needs.sign-windows.result != 'failure'
      && (github.triggering_actor == 'ogulcancelik' || github.repository != 'herdrdev/herdr-core')
    # The R2 keys live here.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ vars.R2_BUCKET }}
      RELEASES_URL: ${{ vars.RELEASES_URL }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        run: |
          export NOTES="$(awk -v heading="## [$VERSION] - " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found && /^- / { sub(/^- /, ""); print; exit }' CHANGELOG.md)"
          scripts/manifest dist > dist/manifest.json && cat dist/manifest.json
      # A fork has no bucket.
      - name: Upload
        if: github.repository == 'herdrdev/herdr-core'
        run: |
          s3() { aws s3 cp --endpoint-url "$ENDPOINT" "$@"; }
          for f in dist/herdr-core-*.tar.gz dist/herdr-core-*.zip dist/manifest.json; do
            s3 "$f" "s3://$BUCKET/core/$VERSION/$(basename "$f")" --cache-control "public, max-age=31536000, immutable"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: dist/manifest.json
          if-no-files-found: error
          retention-days: 7

  # Commit P = this commit + nix/pins.json with the staged archives' hashes,
  # tagged v<version>. A tag pushed with GITHUB_TOKEN starts no workflow.
  tag:
    needs: [prepare, stage]
    # sign-windows may be skipped; that skips jobs after it unless they ask.
    if: ${{ !cancelled() && needs.stage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Keeps GITHUB_TOKEN for the tag push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: herdr-core-{linux,macos}-*
          path: dist
          merge-multiple: true
      - id: commit
        run: |
          pins='{}'
          for pair in aarch64-darwin:macos-aarch64 aarch64-linux:linux-aarch64 x86_64-darwin:macos-x86_64 x86_64-linux:linux-x86_64; do
            name=herdr-core-${pair#*:}.tar.gz
            hash=sha256-$(openssl dgst -sha256 -binary "dist/$name" | base64)
            pins=$(jq --arg system "${pair%%:*}" --arg name "$name" --arg hash "$hash" '.[$system] = {name: $name, hash: $hash}' <<< "$pins")
          done
          jq --arg version "$VERSION" '{version: $version, assets: .}' <<< "$pins" > nix/pins.json
          cat nix/pins.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: nix pins for $VERSION" -- nix/pins.json
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The flake at P, built on each Nix system and pushed to the herdr Cachix
  # cache. The store gets each archive from this run, so the fetch passes
  # before anything is announced; it still checks the archive against P.
  nix:
    needs: [prepare, tag]
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux, name: linux-x86_64, runner: ubuntu-latest }
          - { system: aarch64-linux, name: linux-aarch64, runner: ubuntu-22.04-arm }
          - { system: x86_64-darwin, name: macos-x86_64, runner: macos-15-intel }
          - { system: aarch64-darwin, name: macos-aarch64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    # The Cachix token lives here.
    environment: cachix
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # A fork has no token: builds, pushes nothing.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: github.repository == 'herdrdev/herdr-core'
        with:
          name: herdr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-core-${{ matrix.name }}
          path: dist
      - run: nix-store --add-fixed sha256 dist/herdr-core-${{ matrix.name }}.tar.gz
      - run: |
          out=$(nix build .#default --print-build-logs --no-link --print-out-paths)
          got=$("$out/bin/hc" --version)
          [ "$got" = "hc $VERSION" ] || { echo "hc --version says $got, want hc $VERSION"; exit 1; }

  # core/latest.json last, then the install scripts: announced only once the
  # files are up and P is tagged.
  publish:
    needs: [prepare, stage, tag]
    # Only Can: anyone with write access can re-run an old run's jobs, which
    # would point latest.json back at that version. A fork has no bucket.
    if: >-
      !cancelled() && needs.stage.result == 'success' && needs.tag.result == 'success'
      && github.repository == 'herdrdev/herdr-core' && github.triggering_actor == 'ogulcancelik'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: dist
      - name: Upload
        run: |
          s3() { aws s3 cp --endpoint-url "$ENDPOINT" "$@"; }
          s3 dist/manifest.json "s3://$BUCKET/core/latest.json" --cache-control "no-cache" --content-type application/json
          s3 distribution/install.sh "s3://$BUCKET/core/install.sh" --cache-control "no-cache" --content-type text/x-shellscript
          s3 distribution/install.ps1 "s3://$BUCKET/core/install.ps1" --cache-control "no-cache" --content-type text/plain

  # master moves to P when nothing landed on it since this run started.
  master:
    needs: [prepare, tag]
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      P: ${{ needs.tag.outputs.sha }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BRANCH...$P" --jq .status)
          if [ "$status" != ahead ]; then
            echo "::notice::$BRANCH moved since the release started ($status); it keeps its pins"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$P" -F force=false
